<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture this tab in RECALL</title>
    <style>
      body { margin: 0; width: 320px; background: #0b0b0c; color: #ece6da; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
      header { display: flex; gap: 9px; align-items: center; padding: 12px; border-bottom: 1px solid rgba(236,230,218,.14); }
      header b { letter-spacing: .25em; font-size: 12px; }
      header small { display: block; color: #8c887f; font-size: 8px; letter-spacing: .1em; }
      .mark { width: 28px; height: 28px; border: 1px solid rgba(245,181,68,.5); border-radius: 7px; display: grid; place-items: center; color: #f5b544; font-size: 14px; }
      main { padding: 12px; }
      label { display: block; color: #8c887f; font-size: 9px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
      input, textarea { width: 100%; box-sizing: border-box; background: #171a1e; color: #ece6da; border: 1px solid rgba(236,230,218,.14); border-radius: 6px; padding: 7px; font: inherit; font-size: 11px; }
      textarea { min-height: 60px; resize: vertical; }
      button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 6px; background: #f5b544; color: #1b1305; font-weight: 700; cursor: pointer; }
      p { color: #8c887f; font-size: 9px; margin: 9px 0 0; }
      a { color: #ffd28a; }
    </style>
  </head>
  <body>
    <header><span class="mark">|||</span><span><b>RECALL</b><small>SAFE CAPTURE</small></span></header>
    <main>
      <label for="title">Title</label>
      <input id="title" />
      <label for="text" style="margin-top:8px">Note</label>
      <textarea id="text"></textarea>
      <button id="go">Open in RECALL</button>
      <p>Only this text and a link open in RECALL. The page is not scraped or uploaded.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
